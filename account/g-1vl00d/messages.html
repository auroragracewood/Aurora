<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages · Aurora Gracewood</title>
<link rel="icon" type="image/png" href="/assets/logo.png" />
<link rel="stylesheet" href="/account/realm.css" />
<script src="/account/realm.js"></script>

</head>
<body>
<div class="layout">
  <div class="realm-banner superuser">
    <span>SUPERUSER REALM · Messages</span>
    <span class="as-info">acting as user_id=<span id="as-display"></span></span>
  </div>
  <nav class="nav">
    <a data-realm-link href="/g-1vl00d/superuser">Profile</a>
    <a data-realm-link href="/g-1vl00d/profile-edit">Edit profile</a>
    <a data-realm-link href="/g-1vl00d/submissions">Submissions</a>
    <a data-realm-link href="/g-1vl00d/messages">Messages</a>
    <a data-realm-link href="/g-1vl00d/sessions">Sessions</a>
    <a data-realm-link href="/g-1vl00d/activity">Activity</a>
    <a data-realm-link href="/g-1vl00d/notifications">Notifications</a>
    <a data-realm-link href="/g-1vl00d/settings">Settings</a>
    <a data-realm-link href="/g-1vl00d/manage-users">Manage users</a>
    <span class="nav-menu-wrap">
      <span class="nav-menu-ghost">Menu &#9662;</span>
      <span class="nav-menu" data-state="closed">
        <button type="button" class="nav-menu-toggle" aria-haspopup="true" aria-expanded="false"><span class="nav-menu-label">Menu</span><span class="nav-menu-arrow">&#9662;</span></button>
        <span class="nav-menu-list">
          <a href="/">Home</a>
          <a href="/awards/">Awards</a>
          <a href="#" data-public-profile-link>Public profile</a>
          <a href="/awards/#submit">Submit entry</a>
        </span>
      </span>
    </span>
  </nav>
  
<section class="card">
  <h2>Send a message</h2>
  <div class="row"><span class="label">To (user_id)</span><input id="to_user" type="number" placeholder="2 = admin, 3 = client" /><span></span></div>
  <div class="row"><span class="label">Subject</span><input id="subject" /><span></span></div>
  <div class="row"><span class="label">Body</span><textarea id="body"></textarea><span></span></div>
  <div style="margin-top:14px"><button class="btn" id="send">Send</button></div>
  <div class="status" id="send-status"></div>
</section>
<section class="card">
  <h2>Conversations</h2>
  <div id="messages-list">loading…</div>
</section>
<script>
function renderMetaCell(m, inbound) {
  const ts = AURORA.fmtTs(m.created_at);
  if (!inbound) return ts;
  if (m.read_at) {
    return ts + '<br/><span class="msg-readstamp" style="color:var(--gc-dim)">read ' + AURORA.fmtTs(m.read_at) + '</span>' +
           ' <button class="msg-mark-btn is-unmark" data-unmark="' + m.id + '" type="button" title="Mark as unread">↩ unread</button>';
  }
  return ts + '<br/><span class="msg-unread">UNREAD</span>' +
         ' <button class="msg-mark-btn" data-mark="' + m.id + '" type="button" title="Mark as read">✓ read</button>';
}

function wireRow(row, m) {
  const inbound = !!m.inbound;
  row.querySelectorAll("[data-mark]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true; const orig = b.textContent; b.textContent = "…";
    try {
      await AURORA.markMessageRead(m.id);
      m.read_at = Math.floor(Date.now() / 1000);
      row.querySelector(".msg-meta").innerHTML = renderMetaCell(m, inbound);
      wireRow(row, m);
    } catch (err) {
      b.disabled = false; b.textContent = orig;
      AGUI.toast("Couldn't mark as read: " + (err.message || err), { type: "error" });
    }
  }));
  row.querySelectorAll("[data-unmark]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true; const orig = b.textContent; b.textContent = "…";
    try {
      await AURORA.markMessageUnread(m.id);
      m.read_at = null;
      row.querySelector(".msg-meta").innerHTML = renderMetaCell(m, inbound);
      wireRow(row, m);
    } catch (err) {
      b.disabled = false; b.textContent = orig;
      AGUI.toast("Couldn't mark as unread: " + (err.message || err), { type: "error" });
    }
  }));
}

async function loadMessages() {
  const list = await AURORA.api("GET", "/api/messages");
  const e = AURORA.el("messages-list");
  if (list.length === 0) { e.innerHTML = '<p style="color:var(--gc-dim)">No messages yet.</p>'; return; }
  e.innerHTML = list.map(m => {
    const inbound = !!m.inbound;
    return '<div class="msg-row" data-mid="' + m.id + '">' +
      '<div>' +
      '<div class="msg-from">' + (inbound ? '↓ FROM' : '↑ TO') + ' <span class="role-tag ' + (inbound ? m.from_role : m.to_role) + '">' + (inbound ? m.from_role : m.to_role) + '</span> ' + (inbound ? m.from_name : m.to_name) + ' (#' + (inbound ? m.from_user : m.to_user) + ')</div>' +
      '<div class="msg-subject">' + (m.subject || "(no subject)") + '</div>' +
      '<div class="msg-body">' + m.body + '</div>' +
      '</div>' +
      '<div class="msg-meta">' + renderMetaCell(m, inbound) + '</div>' +
      '</div>';
  }).join("");
  list.forEach(m => {
    const row = e.querySelector('.msg-row[data-mid="' + m.id + '"]');
    if (row) wireRow(row, m);
  });
}
AURORA.el("send").onclick = async () => {
  try {
    await AURORA.api("POST", "/api/messages", {
      to_user: parseInt(AURORA.el("to_user").value),
      subject: AURORA.el("subject").value,
      body: AURORA.el("body").value,
    });
    AURORA.el("subject").value = "";
    AURORA.el("body").value = "";
    AURORA.setStatus("send-status", "Sent.", true);
    loadMessages();
  } catch (e) { AURORA.setStatus("send-status", e.message, false); }
};
loadMessages();
</script>

</div>
<script>
  document.getElementById("as-display").textContent = AURORA.asId;
</script>
</body>
</html>

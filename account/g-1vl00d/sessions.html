<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Active Sessions · Aurora Gracewood</title>
<link rel="stylesheet" href="/account/realm.css" />
<script src="/account/realm.js"></script>

</head>
<body>
<div class="layout">
  <div class="realm-banner superuser">
    <span>SUPERUSER REALM · Active Sessions</span>
    <span class="as-info">acting as user_id=<span id="as-display"></span></span>
  </div>
  <nav class="nav">
    <a data-realm-link href="/g-1vl00d/superuser">Profile</a>
<a data-realm-link href="/g-1vl00d/profile-edit">Edit profile</a>
<a data-realm-link href="/g-1vl00d/settings">Settings</a>
<a data-realm-link href="/g-1vl00d/notifications">Notifications</a>
<a data-realm-link href="/g-1vl00d/sessions">Sessions</a>
<a data-realm-link href="/g-1vl00d/activity">Activity</a>
<a data-realm-link href="/g-1vl00d/messages">Messages</a>
<a data-realm-link href="/g-1vl00d/manage-users">Manage users</a>
  </nav>
  
<section class="card">
  <h2>Active sessions</h2>
  <div id="sessions-list">loading…</div>
  <div style="margin-top:14px"><button class="btn-danger" id="signout-all">Sign out everywhere</button></div>
  <div class="status" id="status"></div>
</section>
<script>
async function load() {
  const list = await AURORA.api("GET", "/api/sessions");
  const e = AURORA.el("sessions-list");
  if (list.length === 0) { e.innerHTML = '<p style="color:var(--gc-dim)">No tracked sessions yet (sessions table is empty in dev).</p>'; return; }
  e.innerHTML = list.map(s =>
    '<div class="row"><span class="label">' + (s.user_agent || "—") + '</span>' +
    '<span class="value mono">ip ' + (s.ip || "—") + ' · last seen ' + AURORA.fmtTs(s.last_seen_at) + '</span>' +
    '<button class="btn-danger" onclick="revoke(\'' + s.id + '\')">Revoke</button></div>'
  ).join("");
}
async function revoke(sid) {
  try { await AURORA.api("DELETE", "/api/sessions/" + sid); load(); }
  catch (e) { AURORA.setStatus("status", e.message, false); }
}
AURORA.el("signout-all").onclick = async () => {
  try { await AURORA.api("DELETE", "/api/sessions"); AURORA.setStatus("status", "All sessions revoked.", true); load(); }
  catch (e) { AURORA.setStatus("status", e.message, false); }
};
load();
</script>

</div>
<script>
  document.getElementById("as-display").textContent = AURORA.asId;
</script>
</body>
</html>
